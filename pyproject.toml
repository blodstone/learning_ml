[project]
name = "learning-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "accelerate>=1.15.0",
  "cairosvg>=2.9.1",
  "debugpy>=1.8.20",
  "fancy-einsum>=0.0.3",
  "ipykernel>=7.2.0",
  "ipywidgets>=8.1.9",
  "jupyter>=1.1.1",
  "jupyter-client>=8.8.0",
  "jupytext>=1.19.6",
  "kaleido>=1.5.0",
  "matplotlib>=3.10.8",
  "nnsight>=0.8.1",
  "numpy>=2.0.0",
  "plotly>=7.1.0",
  "pnglatex>=1.1",
  "pynvim>=0.6.0",
  "pyperclip>=1.11.0",
  "pytest>=9.0.2",
  "scikit-learn>=1.9.1",
  "torch>=2.13.0",
  "torchvision>=0.29.2",
]
[tool.ruff.format]
quote-style = "single"

[project.optional-dependencies]
cpu = ["torch"]
cuda = ["torch"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cuda", extra = "cuda" },
  { index = "pytorch-cpu", extra = "cpu" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["ipykernel>=7.2.0"]

[tool.uv]
environments = ["sys_platform == 'linux'"]
no-cache = true
index-strategy = "unsafe-first-match"
link-mode = "copy"
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.pytest.ini_options]
markers = [
  "integration: tests that load real models and may require network/GPU",
]
